nl:
  site_settings:
    account_security_enabled: "Account Security inschakelen. De plugin werkt in deze versie observerend en blokkeert accounts nooit automatisch."
    account_security_ip_reputation_enabled: "IP-reputatie-intelligence binnen Account Security inschakelen."
    account_security_abuseipdb_api_key: "AbuseIPDB API v2-sleutel. Wordt uitsluitend server-side als secret opgeslagen."
    account_security_abuseipdb_max_age_days: "Maximale ouderdom van meldingen die via AbuseIPDB CHECK worden meegenomen."
    account_security_registration_checks_enabled: "Publieke registratie-IP-adressen na accountaanmaak beoordelen."
    account_security_login_checks_enabled: "Publieke IP-adressen na succesvolle login beoordelen."
    account_security_account_correlation_enabled: "Lokale accountcorrelatie inschakelen. Dit vergelijkt Discourse registratie-/huidige IP-adressen, core IP-historie, authenticatie-IP-historie en andere lokale signalen. Exact gedeelde IP-adressen blijven zichtbaar, ook wanneer context de score verlaagt. Accountcorrelatie schorst of blokkeert accounts nooit automatisch."
    account_security_correlation_min_score: "Minimale score voor nieuwe correlatiekandidaten die niet al een exact IP delen. Kandidaten met exact gedeeld IP blijven zichtbaar wanneer contextuele aftrek ze onder deze score brengt. Browsercontinuïteit is uitsluitend aanvullend en maakt nooit zelfstandig een kandidaat aan."
    account_security_correlation_retention_days: "Aantal dagen dat onopgeloste, gemonitorde, verwachte gedeelde-netwerk- en afgewezen correlatiekandidaten worden bewaard. Bevestigde dubbele accounts blijven bewaard zolang beide accounts bestaan."
    account_security_browser_continuity_enabled: "Gebruik na succesvolle logins een optioneel first-party browsercontinuïteitssignaal. Een signed Secure, HttpOnly, host-only cookie wordt vóór opslag met een HMAC verwerkt; de ruwe token wordt nooit opgeslagen. Dit signaal is uitsluitend aanvullend: het kan een al kwalificerend paar versterken, maar maakt nooit zelfstandig een kandidaat aan. Een ontbrekende, verwijderde of gewijzigde cookie verlaagt de correlatiescore nooit."
    account_security_correlation_auto_scan_frequency: "Hoe vaak bestaande accounts automatisch opnieuw worden gescand met lokale correlatie-evidence. Maandelijks is standaard; kies uit uit, wekelijks, maandelijks, per kwartaal of jaarlijks."
    account_security_correlation_auto_scan_time: "Tijdstip voor de automatische correlatiescan in 24-uursnotatie HH:MM. Sla de planning via de pagina Accountcorrelatie op in de tijdzone van je eigen Discourse-account; de scheduler rekent deze intern om voor uitvoering op de achtergrond."
    account_security_correlation_auto_scan_timezone: "Interne IANA-tijdzone voor automatische accountcorrelatieplanning. Deze wordt beheerd door de planningeditor op de pagina Accountcorrelatie en is bewust verborgen in de normale instellingen."
    account_security_correlation_auto_scan_weekday: "Weekdag die alleen wordt gebruikt wanneer {{setting:account_security_correlation_auto_scan_frequency}} op wekelijks staat."
    account_security_correlation_auto_scan_day_of_month: "Dag van de maand voor maandelijkse, kwartaal- en jaarlijkse automatische scans. Beperkt tot 1-28 zodat iedere maand de ingestelde dag heeft."
    account_security_auth_abuse_detection_enabled: "Mislukte logins, ongeldige logincodes, wachtwoordresetverzoeken en afgewezen registraties lokaal clusteren. Counters staan tijdelijk in Redis en providerchecks vinden pas plaats nadat een ingestelde drempel is overschreden."
    account_security_failed_login_threshold: "Aantal mislukte logins vanaf één publiek IP over verschillende gebruikersnamen binnen 10 minuten voordat één abuse-clusterbeoordeling mag plaatsvinden."
    account_security_failed_login_single_account_threshold: "Aantal mislukte logins vanaf één publiek IP tegen hetzelfde account binnen 10 minuten voordat één abuse-clusterbeoordeling mag plaatsvinden."
    account_security_login_code_failure_threshold: "Aantal ongeldige logincodepogingen vanaf één publiek IP binnen 15 minuten voordat één abuse-clusterbeoordeling mag plaatsvinden."
    account_security_password_reset_threshold: "Aantal wachtwoordresetverzoeken vanaf één publiek IP binnen 60 minuten voordat één abuse-clusterbeoordeling mag plaatsvinden. Ook door Discourse rate limits geweigerde verzoeken tellen als lokale abuse-telemetrie."
    account_security_rejected_registration_threshold: "Aantal door core-validatie afgewezen registratiepogingen vanaf één publiek IP binnen 30 minuten voordat één registratie-abusebeoordeling mag plaatsvinden."
    account_security_blacklist_sync_enabled: "De AbuseIPDB high-confidence blacklist lokaal vier keer per dag synchroniseren."
    account_security_tor_feed_enabled: "De officiële Tor-exitlijst elk uur lokaal synchroniseren. Tor is alleen context en verhoogt zelfstandig nooit het risico."
    account_security_abuse_reporting_enabled: "Sta handmatige provider-rapportage alleen toe voor lokaal bevestigd authenticatiemisbruik waarvan de drempel is overschreden en dat tevens door een High/Critical providersignaal wordt bevestigd. Standaard UIT; er wordt nooit automatisch gerapporteerd."
    account_security_user_notes_enabled: "Voeg één beknopte User Note toe bij een geëscaleerd High/Critical-event wanneer de Discourse User Notes-plugin beschikbaar is. Standaard UIT. De notitie bevat geen ruw IP-adres of providerscore."
    account_security_temporary_ip_blocks_enabled: "Sta beheerders toe om vanuit geschikte High/Critical-events expliciete tijdelijke Discourse IP-blokkades aan te maken. Standaard UIT. Account Security neemt nooit een bestaande screeningregel over."
    account_security_staff_notifications_enabled: "Stuur per kwalificerend incident één privébericht vanuit het systeemaccount naar de ingestelde staffgroepen. Standaard UIT."
    account_security_notification_groups: "Groepen die Account Security-incidentberichten ontvangen wanneer staffnotificaties zijn ingeschakeld."
    account_security_notification_include_ip: "Neem het exacte IP-adres op in incidentberichten. Standaard UIT; de eventdetailpagina blijft de aangewezen plaats om het IP te bekijken."
    account_security_daily_check_budget: "Lokale veiligheidslimiet voor AbuseIPDB CHECK-verzoeken per UTC-dag."
    account_security_registration_reserve: "Gereserveerde checks voor nieuwe registraties."
    account_security_staff_reserve: "Gereserveerde checks voor nieuwe staff/admin-netwerken."
    account_security_auth_failure_reserve: "Gereserveerde checks voor lokaal gedrempelde authenticatiemisbruikclusters voordat normale loginverrijking deze capaciteit kan gebruiken."
    account_security_manual_reserve: "Gereserveerde checks voor handmatige beheerder-lookups."
    account_security_ipv6_familiarity_prefix: "IPv6-prefix voor lokale netwerkherkenning per gebruiker."
    account_security_user_network_retention_days: "Bewaartermijn voor compacte gebruiker-netwerkrelaties."
    account_security_event_retention_days: "Bewaartermijn voor security-events."
    account_security_low_risk_cache_retention_days: "Bewaartermijn voor Low/Observed IP-intelligence."
    account_security_stats_retention_days: "Bewaartermijn voor geaggregeerde dagelijkse statistieken."
    account_security_connect_timeout_ms: "Maximale connectietijd voor providerverzoeken."
    account_security_read_timeout_ms: "Maximale leestijd voor providerverzoeken."
    account_security_circuit_breaker_failure_count: "Aantal providerfouten voordat de circuit breaker opent."
    account_security_circuit_breaker_window_minutes: "Tijdsvenster voor circuit-breaker fouten."
    account_security_circuit_breaker_open_minutes: "Hoe lang providerverkeer wordt gepauzeerd als het circuit opent."

  dashboard:
    problem:
      account_security_operational_health: "Account Security is gedegradeerd (%{status}; %{reason}). <a href='%{base_path}/admin/plugins/account-security-health'>Open Account Security Health</a>."

  admin:
    account_security:
      trusted:
        broad_confirmation_required: "Brede netwerkranges vereisen expliciete bevestiging."
        duplicate: "Dit trusted network bestaat al."
      correlations:
        disabled: "Accountcorrelatie is uitgeschakeld in de instellingen."
      events:
        user_note_unavailable: "Voor dit event kan geen User Note worden aangemaakt."
        existing_ip_screening: "Voor dit adres geldt al een Discourse IP-screeningregel. Account Security vervangt deze niet en neemt deze niet over."
        temporary_block_not_eligible: "Dit event voldoet niet aan de veiligheidsvoorwaarden voor een tijdelijke IP-blokkade."
        notification_suppression_not_eligible: "Notificatieonderdrukking is voor dit event niet beschikbaar omdat geen gebruiker-netwerkpaar beschikbaar is of er geen actieve onderdrukking bestaat."

  account_security:
    user_note: "Account Security event #%{event_id}: %{event_type} is geëscaleerd voor staffbeoordeling met ernst %{severity}. Dit securitysignaal stelt op zichzelf geen misbruik door het account vast."
    notification:
      title: "Account Security: %{severity}-incident"
      no_user: "Geen afzonderlijk account"
      severities:
        elevated: "Verhoogd"
        high: "Hoog"
        critical: "Kritiek"
      event_types:
        registration: "Registratie"
        login_new_network: "Login vanaf een nieuw netwerk"
        staff_login_new_network: "Staff/admin-login vanaf een nieuw netwerk"
        auth_failure_cluster: "Cluster van mislukte authenticaties"
        registration_abuse_cluster: "Cluster van afgewezen registraties"
      context:
        tor: "Tor-exit"
        local_blacklist: "lokale high-confidence blacklist"
        staff_targeted: "staff/admin-account als doelwit"
        unavailable: "niet beschikbaar"
      kinds:
        critical_registration: "Kritiek registratiesignaal"
        staff_new_network: "Hoog-risico nieuw staff/admin-netwerk"
        auth_abuse_cluster: "Gecorreleerd authenticatiemisbruikcluster"
        repeated_high_networks: "Herhaalde hoog-risiconetwerken voor één account"
      body: |-
        Account Security heeft een incident gedetecteerd dat voldoet aan de ingestelde notificatiedrempel voor staff.

        - Trigger: %{kind}
        - Ernst: %{severity}
        - Eventtype: %{event_type}
        - Gebruiker: %{user}
        - Netwerkcontext: %{network_context}%{ip_line}

        Bekijk alle interne evidence en context: %{event_url}

        Dit securitysignaal stelt op zichzelf geen misbruik door het account vast. Er is niet automatisch gemodereerd of geblokkeerd.

