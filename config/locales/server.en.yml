en:
  site_settings:
    account_security_enabled: "Enable Account Security. The plugin starts in observation mode and never blocks accounts automatically in this version."
    account_security_ip_reputation_enabled: "Enable IP reputation intelligence inside Account Security."
    account_security_abuseipdb_api_key: "AbuseIPDB API v2 key. Stored server-side as a secret and never serialized to the browser."
    account_security_abuseipdb_max_age_days: "Maximum report age requested from AbuseIPDB CHECK. Normal operation does not request verbose report comments."
    account_security_registration_checks_enabled: "Assess public registration IP addresses after account creation."
    account_security_login_checks_enabled: "Assess public IP addresses after successful login, prioritizing newly observed networks."
    account_security_account_correlation_enabled: "Enable local account-correlation analysis. This compares Discourse registration/current IPs, core IP history, authentication IP history and other local signals. Exact shared IPs remain visible even when context lowers their score. Account correlation never suspends or blocks accounts automatically."
    account_security_correlation_min_score: "Minimum score for new correlation candidates that do not already share an exact IP. Exact shared-IP candidates remain visible even when contextual penalties put them below this score. Browser continuity is supplemental only and never creates a candidate by itself."
    account_security_correlation_retention_days: "Days to retain unresolved, monitored, expected-shared-network and dismissed correlation candidates. Confirmed duplicate classifications are retained while both accounts exist."
    account_security_browser_continuity_enabled: "Use an optional first-party browser-continuity signal after successful logins. A signed Secure, HttpOnly, host-only cookie is HMACed before persistence; the raw token is never stored. This signal is supplemental only: it can strengthen an already qualifying pair but never creates a candidate on its own. A missing, cleared or changed cookie never lowers a correlation score."
    account_security_correlation_auto_scan_frequency: "How often to automatically rescan existing accounts using local correlation evidence. Monthly is the default; choose off, weekly, monthly, quarterly or yearly."
    account_security_correlation_auto_scan_time: "Automatic correlation scan time in 24-hour HH:MM format. Installed Plugins → Settings is the single source of truth. The scheduler uses the configured site-contact account timezone when available; the Account Correlation page displays the next run in each administrator’s own Discourse timezone."
    account_security_correlation_auto_scan_timezone: "Internal legacy/fallback IANA timezone for automatic account-correlation scheduling. Normal scheduling is configured only through the visible scan settings."
    account_security_correlation_auto_scan_weekday: "Weekday used only when {{setting:account_security_correlation_auto_scan_frequency}} is weekly."
    account_security_correlation_auto_scan_day_of_month: "Day of the month used for monthly, quarterly and yearly automatic scans. Limited to 1-28 so every month has the configured day."
    account_security_auth_abuse_detection_enabled: "Locally aggregate failed logins, invalid login codes, password-reset requests and rejected registrations. Counters live in Redis and expire automatically; provider checks occur only after a configured threshold is crossed."
    account_security_failed_login_threshold: "Failed login attempts from one public IP across usernames within 10 minutes before one abuse-cluster assessment is eligible."
    account_security_failed_login_single_account_threshold: "Failed login attempts from one public IP against the same account within 10 minutes before one abuse-cluster assessment is eligible."
    account_security_login_code_failure_threshold: "Invalid login-code attempts from one public IP within 15 minutes before one abuse-cluster assessment is eligible."
    account_security_password_reset_threshold: "Password-reset requests from one public IP within 60 minutes before one abuse-cluster assessment is eligible. Requests rejected by Discourse rate limits are still local abuse telemetry."
    account_security_rejected_registration_threshold: "Registration attempts rejected by core validation from one public IP within 30 minutes before one registration-abuse assessment is eligible."
    account_security_blacklist_sync_enabled: "Synchronize the AbuseIPDB high-confidence blacklist locally four times per day."
    account_security_tor_feed_enabled: "Synchronize the official Tor exit list locally once per hour. Tor is context only and never raises risk by itself."
    account_security_abuse_reporting_enabled: "Permit manual provider reporting only for a locally confirmed, threshold-exceeded authentication-abuse event that is also corroborated by a High/Critical provider signal. OFF by default; no report is sent automatically."
    account_security_user_notes_enabled: "Add one concise User Note for a High/Critical escalated event when the Discourse User Notes plugin is available. OFF by default. Notes omit the raw IP address and provider score."
    account_security_temporary_ip_blocks_enabled: "Allow administrators to create explicit, time-limited Discourse IP blocks from eligible High/Critical events. OFF by default. Account Security never takes ownership of an existing screening rule."
    account_security_staff_notifications_enabled: "Send one incident-based private message from the system account to the configured staff groups for qualifying escalations. OFF by default."
    account_security_correlation_notifications_enabled: "Send deduplicated staff private messages for new real-time Strong/Very strong account-correlation findings. OFF by default. Full/manual/scheduled historical scans never generate notification floods."
    account_security_notification_groups: "Groups that receive Account Security incident private messages when staff notifications are enabled."
    account_security_notification_include_ip: "Include the exact IP address in incident private messages. OFF by default; the event detail page remains the authoritative place to view the IP."
    account_security_daily_check_budget: "Local safety budget for AbuseIPDB CHECK requests per UTC day. Provider rate-limit headers remain authoritative."
    account_security_registration_reserve: "Checks protected for new registrations before normal-user login enrichment may consume them."
    account_security_staff_reserve: "Checks protected for new staff/admin login networks."
    account_security_auth_failure_reserve: "Checks protected for locally thresholded authentication-abuse clusters before normal-user login enrichment may consume them."
    account_security_manual_reserve: "Checks protected for explicit administrator lookups."
    account_security_ipv6_familiarity_prefix: "IPv6 prefix used only for per-user network familiarity. Provider checks still use the exact IPv6 address."
    account_security_user_network_retention_days: "Days to retain compact user-to-network familiarity records."
    account_security_event_retention_days: "Days to retain open/actioned security events. Benign events may be removed sooner by future versions."
    account_security_low_risk_cache_retention_days: "Days to retain Low/Observed IP intelligence after it was last seen."
    account_security_stats_retention_days: "Days to retain aggregate daily Account Security statistics."
    account_security_connect_timeout_ms: "Maximum connect time for a provider request."
    account_security_read_timeout_ms: "Maximum read time for a provider request."
    account_security_circuit_breaker_failure_count: "Provider failures inside the configured window required to open the circuit."
    account_security_circuit_breaker_window_minutes: "Failure-counting window for the provider circuit breaker."
    account_security_circuit_breaker_open_minutes: "How long ordinary provider traffic is paused after the circuit breaker opens."

  dashboard:
    problem:
      account_security_operational_health: "Account Security is degraded (%{status}; %{reason}). <a href='%{base_path}/admin/plugins/account-security-health'>Open Account Security Health</a>."

  admin:
    account_security:
      trusted:
        broad_confirmation_required: "Broad network ranges require explicit confirmation."
        duplicate: "That trusted network already exists."
      correlations:
        disabled: "Account correlation is disabled in settings."
        review_note_required: "Add an investigation note before saving this classification."
      events:
        user_note_unavailable: "A User Note cannot be created for this event."
        existing_ip_screening: "A Discourse IP screening rule already applies to this address. Account Security will not replace or take ownership of it."
        temporary_block_not_eligible: "This event does not meet the safety requirements for a temporary IP block."
        notification_suppression_not_eligible: "Notification suppression is unavailable for this event because no user/network pair is available or no active suppression exists."

  account_security:
    user_note: "Account Security event #%{event_id}: %{event_type} was escalated for staff review with %{severity} severity. This security signal does not by itself establish account misconduct."

    correlation_notification:
      title: "Account Security: %{confidence} account correlation"
      unknown_user: "Unknown account"
      confidences:
        strong: "Strong"
        very_strong: "Very strong"
      body: |-
        Account Security detected a new or materially stronger real-time account-correlation finding.

        - Accounts: %{user_a} ↔ %{user_b}
        - Current score: %{score}
        - Confidence: %{confidence}
        - Shared exact IPs: %{shared_ips}
        - Shared public IPs: %{public_ips}
        - Shared IPs backed by authentication/session history: %{auth_ips}

        Review the internal evidence and investigation history: %{correlation_url}

        This is an investigation signal only. No account was suspended, blocked, merged or otherwise moderated automatically.

    notification:
      title: "Account Security: %{severity} incident"
      no_user: "No single account"
      severities:
        elevated: "Elevated"
        high: "High"
        critical: "Critical"
      event_types:
        registration: "Registration"
        login_new_network: "Login from a new network"
        staff_login_new_network: "Staff/admin login from a new network"
        auth_failure_cluster: "Failed-authentication cluster"
        registration_abuse_cluster: "Rejected-registration cluster"
      context:
        tor: "Tor exit"
        local_blacklist: "local high-confidence blacklist"
        staff_targeted: "staff/admin account targeted"
        unavailable: "not available"
      kinds:
        critical_registration: "Critical registration signal"
        staff_new_network: "High-risk new staff/admin network"
        auth_abuse_cluster: "Corroborated authentication-abuse cluster"
        repeated_high_networks: "Repeated high-risk networks for one account"
      body: |-
        Account Security detected an incident that meets the configured staff-notification threshold.

        - Trigger: %{kind}
        - Severity: %{severity}
        - Event type: %{event_type}
        - User: %{user}
        - Network context: %{network_context}%{ip_line}

        Review the full internal evidence and context: %{event_url}

        This security signal does not by itself establish account misconduct. No moderation or blocking action was performed automatically.

