          privacy_text: "External provider checks contain only the public IP address. Usernames, email addresses, post/PM/chat content and provider report comments are never sent to AbuseIPDB. Authentication-abuse counters use short-lived one-way target tokens in Redis. Account correlation stores no raw user-agent strings. Correlation investigation notes remain local to the forum and are never sent to the external provider. Timing correlation persists only aggregate gaps and observation counts, not copied login timestamps. Optional browser continuity uses a signed first-party Secure/HttpOnly cookie whose raw token is HMACed before persistence; a missing or changed token never lowers a score. This is not a device fingerprint."
